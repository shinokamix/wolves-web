services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travel
      POSTGRES_DB: travel
    ports:
      - '5432:5432'
    volumes:
      - travel-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U travel -d travel']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  travel-db:
